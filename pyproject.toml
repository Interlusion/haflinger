[project]
name = "haflinger"
version = "0.0.0"
description = "E-invoicing for ERPNext: ZUGFeRD, XRechnung and Peppol on one EN 16931 model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
test = [
    "pytest>=9.1.1",
]
dev = [
    { include-group = "test" },
    "basedpyright>=1.40.2",
    "coverage>=7.17.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "TRY", "BLE", "N"]
# Refusal reasons are short fixed strings.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["haflinger"]
