[project]
name = "haflinger"
version = "0.1.0"
description = "E-invoicing in Python: ZUGFeRD, XRechnung and Peppol on one model of the EN 16931 business terms"
readme = "README.md"
# Haflinger's code, and the vendored files under their own terms (THIRD-PARTY-NOTICES, ADR-009).
license = "Apache-2.0 AND EUPL-1.2 AND MIT AND W3C-19980720 AND LicenseRef-OASIS AND LicenseRef-UN-CEFACT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES", "src/haflinger/artefacts/*/LICENSE*"]
requires-python = ">=3.14"
keywords = ["e-invoicing", "EN 16931", "ZUGFeRD", "Factur-X", "XRechnung", "Peppol", "CII", "UBL"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "defusedxml>=0.7.1",
    "lxml>=6.1.3",
    "saxonche>=13.1.1",
]

[project.urls]
Repository = "https://github.com/Interlusion/haflinger"
Documentation = "https://github.com/Interlusion/haflinger/blob/main/docs/README.md"
Issues = "https://github.com/Interlusion/haflinger/issues"
Changelog = "https://github.com/Interlusion/haflinger/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf = [
    "factur-x>=7.9",
    "pypdf>=6.19.0",
]

[dependency-groups]
test = [
    "haflinger[pdf]",
    "pytest>=9.1.1",
]
dev = [
    { include-group = "test" },
    "basedpyright>=1.40.2",
    "coverage>=7.17.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "ruff>=0.17.3",
    "types-defusedxml>=0.7.0.20260504",
    "types-lxml>=2026.2.16",
    "zizmor>=1.31.1",
]

[tool.uv]
# The one place uv's version is pinned: uv refuses another locally, and CI's setup-uv reads it.
required-version = "==0.13.7"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "TRY", "BLE", "N"]
# Refusal reasons are short fixed strings.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "scripts"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["haflinger"]
# The rules' worker process too (ADR-010), but not the copy of the package that one test runs
# it from, which the test changes.
patch = ["subprocess"]
omit = ["*/path/haflinger/*"]
