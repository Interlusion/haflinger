name: Release

# A tag vX.Y.Z on main publishes that version to PyPI, after the maintainer's approval
# (ADR-013, docs/guides/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history, to find the tag's commit in it; the files of the tag's commit only
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The version from pyproject.toml's required-version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: The tag's commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on a commit that isn't on main"
            exit 1
          fi
      # Checks the tag against pyproject.toml and CHANGELOG.md, then points the links to main in
      # the README and the project URLs at the tag, as PyPI shows them with the release.
      - name: The tag, the version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/prepare_release.py "$TAG"
      # With the uv_build that uv bundles, as required-version lies within its range (a test
      # checks it), so no backend is downloaded.
      - run: uv build
      # The tests against the wheel, installed with the locked versions of its dependencies, the
      # extra pdf's and pytest, each checked against its hash in uv.lock.
      - name: Tests against the wheel
        run: |
          uv export --locked --only-group test --no-emit-project --output-file "$RUNNER_TEMP/test.txt"
          uv venv --python 3.14 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" --require-hashes -r "$RUNNER_TEMP/test.txt"
          uv pip install --python "$RUNNER_TEMP/wheel" --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" -m pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30 # as long as the deployment can wait for approval

  # A job of its own, so that the right to sign in to PyPI stays away from the job that builds;
  # the environment waits for the maintainer's approval and admits only tags v*.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/haflinger/
    permissions:
      id-token: write # Trusted Publishing, and the attestations' signatures
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # a run again finishes a partial upload
