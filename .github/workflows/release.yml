name: Release

# A tag vX.Y.Z on main publishes that version to PyPI, after the maintainer's approval, and as a
# GitHub Release; started by hand with a version, it is the dry run, which publishes nothing
# (ADR-013, docs/guides/releasing.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run (X.Y.Z); nothing is published
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history, to find the tag's commit in it; the files of the tag's commit only
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The version from pyproject.toml's required-version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: The tag is annotated, on main, in Interlusion/haflinger
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Released only from this repository, not a fork; GitHub gives the owner in its own case.
          if [ "${REPOSITORY,,}" != interlusion/haflinger ]; then
            echo "::error::Haflinger is released only from Interlusion/haflinger, not $REPOSITORY"
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG isn't an annotated tag"
            exit 1
          fi
          # A run started again after the tag was moved would build the commit it was started for.
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now names another commit than $GITHUB_SHA, which this run builds"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is on a commit that isn't on main"
            exit 1
          fi
      # Checks the tag, or the dry run's version, against pyproject.toml and CHANGELOG.md, then
      # points the links to main in the README and the project URLs at the tag, as PyPI shows
      # them with the release; the GitHub Release's notes too, which the summary shows.
      - name: The version, the changelog, the links to the tag and the notes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then tag="$REF"; else tag="v${VERSION#v}"; fi
          uv run --no-project python scripts/prepare_release.py "$tag"
          mkdir "$RUNNER_TEMP/notes"
          uv run --no-project python scripts/prepare_release.py "$tag" --notes > "$RUNNER_TEMP/notes/notes.md"
          {
            echo "### $tag of $GITHUB_SHA"
            echo
            cat "$RUNNER_TEMP/notes/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      # With the uv_build that uv bundles, as required-version lies within its range (a test
      # checks it), so no backend is downloaded.
      - run: uv build
      # The tests against the wheel, installed with the locked versions of its dependencies, the
      # extra pdf's and pytest, each checked against its hash in uv.lock.
      - name: Tests against the wheel
        run: |
          uv export --locked --only-group test --no-emit-project --output-file "$RUNNER_TEMP/test.txt"
          uv venv --python 3.14 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" --require-hashes -r "$RUNNER_TEMP/test.txt"
          uv pip install --python "$RUNNER_TEMP/wheel" --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" -m pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30 # as long as the deployment can wait for approval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 30

  # A job of its own, so that the right to sign in to PyPI stays away from the job that builds;
  # the environment waits for the maintainer's approval and admits only tags v*.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/haflinger/
    permissions:
      id-token: write # Trusted Publishing, and the attestations' signatures
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # a run again finishes a partial upload

  # After the upload, a job of its own: the one that may write the repository's contents, with
  # the files and the notes that build made, and no code of the repository; run again, it brings
  # an existing release up to date.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
      - name: GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          # gh calls api.github.com with the workflow's token: no other way creates a release.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Haflinger ${TAG#v}" --notes-file "$notes"
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --verify-tag --title "Haflinger ${TAG#v}" \
              --notes-file "$notes" dist/*
          fi
